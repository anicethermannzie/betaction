# =============================================================================
# Rate-limiting zones
#
# Zones are defined in the http context and referenced by name in location
# blocks inside the server block (nginx.conf).
#
# $binary_remote_addr uses the binary form of the client IP address as the
# zone key — 4 bytes for IPv4 / 16 bytes for IPv6. More memory-efficient
# than $remote_addr.
#
# Zone memory allocation:
#   1 MB stores ≈ 16 000 states for binary_remote_addr.
#   Use 10m (10 MB) to comfortably handle ~160 000 unique IPs.
# =============================================================================

# ── General API zone ─────────────────────────────────────────────────────────
# 10 requests/second per IP.
# Applied to: /api/matches, /api/predictions
limit_req_zone $binary_remote_addr zone=api:10m    rate=10r/s;

# ── Auth zone ────────────────────────────────────────────────────────────────
# 1 request/second per IP, covering session checks and token refreshes. A signed
# in client refreshes roughly every 15 minutes, so this is generous for real use.
# Applied to: /api/auth
limit_req_zone $binary_remote_addr zone=auth:10m   rate=1r/s;

# ── Credential zone (strictest) ──────────────────────────────────────────────
# 10 requests/minute per IP on login and register.
#
# The previous 5r/s allowed ~300 password guesses per minute per IP, which is not
# a credential-stuffing defence. Ten per minute is far above what a human
# mistyping a password needs, and far below what online guessing requires.
# auth-service applies a second, per-IP limit of 10 failures / 15 min.
# Applied to: /api/auth/login, /api/auth/register
limit_req_zone $binary_remote_addr zone=credentials:10m rate=10r/m;

# ── WebSocket connection limit ────────────────────────────────────────────────
# Max 20 simultaneous WebSocket connections per IP.
# Applied to: /socket.io
limit_conn_zone $binary_remote_addr zone=ws_limit:10m;

# ── Default status codes when limits are hit ─────────────────────────────────
# 429 Too Many Requests (RFC 6585) is more semantically correct than 503.
limit_req_status  429;
limit_conn_status 429;
